<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Word Cloud - Excel Storage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1d3e 50%, #0f1b35 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #00d9ff, #0099ff);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 217, 255, 0.4);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            font-weight: 500;
        }

        .screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d9ff, #0099ff);
            color: white;
            box-shadow: 0 4px 20px rgba(0, 153, 255, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 217, 255, 0.5);
        }

        .btn-primary:disabled {
            background: #2a2e4a;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #00d9ff;
            border: 2px solid rgba(0, 217, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(0, 217, 255, 0.1);
            border-color: #00d9ff;
        }

        .card {
            background: rgba(20, 25, 50, 0.8);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .input-field {
            width: 100%;
            padding: 15px 20px;
            background: rgba(10, 14, 39, 0.6);
            border: 2px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
        }

        .input-field:focus {
            border-color: #00d9ff;
            box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .cloud-container {
            position: relative;
            min-height: 450px;
            background: rgba(10, 14, 39, 0.4);
            border: 2px solid rgba(0, 217, 255, 0.3);
            border-radius: 50%;
            padding: 50px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
            box-shadow: inset 0 0 60px rgba(0, 217, 255, 0.1);
        }

        .word-item {
            font-weight: 700;
            color: #00d9ff;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
            animation: fadeIn 0.5s ease-out;
        }

        .word-item:hover {
            transform: scale(1.15);
            color: #00fff7;
            text-shadow: 0 0 20px rgba(0, 255, 247, 0.8);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.5);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .stat-badge {
            background: rgba(20, 25, 50, 0.9);
            border: 1px solid rgba(0, 217, 255, 0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d9ff, #00fff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-top: 8px;
        }

        .session-id {
            font-family: 'Courier New', monospace;
            font-size: 28px;
            color: #00d9ff;
            letter-spacing: 8px;
            text-align: center;
            padding: 20px;
            background: rgba(0, 217, 255, 0.05);
            border-radius: 12px;
            border: 2px solid rgba(0, 217, 255, 0.3);
        }

        .hero-title {
            font-size: 56px;
            font-weight: 700;
            background: linear-gradient(135deg, #00d9ff 0%, #00fff7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 217, 255, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0, 217, 255, 0.3);
        }

        .pulse {
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(0, 255, 136, 0.7);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.1);
                box-shadow: 0 0 0 10px rgba(0, 255, 136, 0);
            }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); }
            to { transform: translateX(0); }
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .word-tag {
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.3);
            color: #00d9ff;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            display: inline-block;
        }

        .excel-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 217, 255, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(0, 217, 255, 0.3);
            font-size: 14px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 36px; }
            .session-id { font-size: 20px; letter-spacing: 4px; }
            .cloud-container { border-radius: 40%; padding: 30px; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    <div id="app"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        // Create stars background
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            starsContainer.appendChild(star);
        }

        // Storage system using Excel format
        const storage = {
            async get(key, shared = false) {
                try {
                    if (window.storage && window.storage.get) {
                        const result = await window.storage.get(key, shared);
                        return result;
                    }
                } catch (e) {
                    console.log('Storage API unavailable');
                }
                return null;
            },
            
            async set(key, value, shared = false) {
                try {
                    if (window.storage && window.storage.set) {
                        const result = await window.storage.set(key, value, shared);
                        return result;
                    }
                } catch (e) {
                    console.log('Storage API unavailable');
                }
                return null;
            }
        };

        // App State
        let app = {
            mode: 'select',
            sessionId: '',
            sessionName: '',
            words: [],
            participants: 0,
            liveUsers: 0,
            summary: '',
            isGenerating: false,
            isSubmitted: false,
            pollInterval: null,
            lastExcelUpdate: null
        };

        // Utility Functions
        function notify(msg) {
            const n = document.createElement('div');
            n.className = 'notification';
            n.textContent = msg;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }

        function sound(freq, dur) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur/1000);
                osc.start();
                osc.stop(ctx.currentTime + dur/1000);
            } catch(e) {}
        }

        function speak(text) {
            try {
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.rate = 0.95;
                u.pitch = 1.05;
                speechSynthesis.speak(u);
            } catch(e) {}
        }

        // Excel Storage Functions
        async function saveToExcel() {
            if (!app.sessionId || app.words.length === 0) return;

            // Prepare data for Excel
            const submissionData = app.words.map((w, idx) => ({
                'Entry #': idx + 1,
                'Word': w.text,
                'Timestamp': new Date(w.timestamp).toLocaleString(),
                'Date': new Date(w.timestamp).toLocaleDateString(),
                'Time': new Date(w.timestamp).toLocaleTimeString(),
                'Submission ID': w.id
            }));

            // Calculate frequency
            const freq = {};
            app.words.forEach(w => freq[w.text] = (freq[w.text] || 0) + 1);
            const freqData = Object.entries(freq)
                .sort((a, b) => b[1] - a[1])
                .map(([word, count], idx) => ({
                    'Rank': idx + 1,
                    'Word': word,
                    'Count': count,
                    'Percentage': ((count / app.words.length) * 100).toFixed(1) + '%'
                }));

            // Session info
            const sessionInfo = [
                ['Session Name', app.sessionName],
                ['Session ID', app.sessionId],
                ['Created', new Date(app.words[0]?.timestamp || Date.now()).toLocaleString()],
                ['Last Updated', new Date().toLocaleString()],
                ['Total Submissions', app.words.length],
                ['Unique Words', Object.keys(freq).length],
                ['Total Participants', app.participants],
                ['Live Users', app.liveUsers]
            ];

            // Create workbook
            const wb = XLSX.utils.book_new();

            // Sheet 1: Session Info
            const infoWS = XLSX.utils.aoa_to_sheet(sessionInfo);
            infoWS['!cols'] = [{ width: 20 }, { width: 30 }];
            XLSX.utils.book_append_sheet(wb, infoWS, 'Session Info');

            // Sheet 2: All Submissions
            const submissionsWS = XLSX.utils.json_to_sheet(submissionData);
            submissionsWS['!cols'] = [
                { width: 10 }, // Entry #
                { width: 25 }, // Word
                { width: 22 }, // Timestamp
                { width: 15 }, // Date
                { width: 15 }, // Time
                { width: 20 }  // Submission ID
            ];
            XLSX.utils.book_append_sheet(wb, submissionsWS, 'All Submissions');

            // Sheet 3: Word Frequency
            const freqWS = XLSX.utils.json_to_sheet(freqData);
            freqWS['!cols'] = [
                { width: 8 },  // Rank
                { width: 25 }, // Word
                { width: 10 }, // Count
                { width: 12 }  // Percentage
            ];
            XLSX.utils.book_append_sheet(wb, freqWS, 'Word Frequency');

            // Sheet 4: AI Analysis (if available)
            if (app.summary) {
                const analysisData = [
                    ['AI Analysis Generated', new Date().toLocaleString()],
                    [''],
                    ['Insights', app.summary]
                ];
                const analysisWS = XLSX.utils.aoa_to_sheet(analysisData);
                analysisWS['!cols'] = [{ width: 20 }, { width: 100 }];
                XLSX.utils.book_append_sheet(wb, analysisWS, 'AI Analysis');
            }

            // Convert to base64 for storage
            const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
            
            // Store in persistent storage
            await storage.set(`excel_${app.sessionId}`, wbout, true);
            
            app.lastExcelUpdate = new Date().toLocaleTimeString();
            return wbout;
        }

        async function downloadExcel() {
            const excelData = await saveToExcel();
            if (!excelData) {
                notify('❌ No data to export');
                return;
            }

            // Convert base64 to blob and download
            const byteCharacters = atob(excelData);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `WordCloud_${app.sessionId}_${new Date().toISOString().split('T')[0]}.xlsx`;
            a.click();
            URL.revokeObjectURL(url);
            
            notify('📊 Excel file downloaded');
            sound(900, 120);
        }

        async function loadFromExcel() {
            if (!app.sessionId) return;
            
            const result = await storage.get(`excel_${app.sessionId}`, true);
            if (result && result.value) {
                try {
                    // Read workbook from base64
                    const wb = XLSX.read(result.value, { type: 'base64' });
                    const submissionsSheet = wb.Sheets['All Submissions'];
                    
                    if (submissionsSheet) {
                        const data = XLSX.utils.sheet_to_json(submissionsSheet);
                        app.words = data.map(row => ({
                            text: row['Word'],
                            timestamp: new Date(row['Timestamp']).getTime(),
                            id: row['Submission ID']
                        }));
                        
                        // Get session info
                        const infoSheet = wb.Sheets['Session Info'];
                        const infoData = XLSX.utils.sheet_to_json(infoSheet, { header: 1 });
                        app.participants = parseInt(infoData[6][1]) || 0;
                        app.liveUsers = parseInt(infoData[7][1]) || 0;
                        
                        render();
                    }
                } catch (e) {
                    console.error('Error loading Excel:', e);
                }
            }
        }

        // Core Functions
        async function createSession() {
            const name = prompt('Enter session name:') || 'Word Cloud Session';
            const id = Math.random().toString(36).substr(2, 6).toUpperCase();
            
            app.mode = 'host';
            app.sessionId = id;
            app.sessionName = name;
            app.words = [];
            app.participants = 0;
            app.liveUsers = 1;
            
            // Initialize Excel storage
            await saveToExcel();
            
            notify(`✨ Session Created: ${id}`);
            sound(800, 150);
            startPoll();
            render();
        }

        async function joinSession(id) {
            const clean = id.trim().toUpperCase();
            if (!clean) {
                notify('❌ Enter Session ID');
                return;
            }
            
            try {
                app.sessionId = clean;
                await loadFromExcel();
                
                if (app.words.length > 0 || app.sessionName) {
                    app.mode = 'audience';
                    app.participants++;
                    app.liveUsers++;
                    app.isSubmitted = false;
                    
                    await saveToExcel();
                    
                    notify('✨ Connected Successfully');
                    sound(900, 100);
                    startPoll();
                    render();
                } else {
                    notify('❌ Session Not Found');
                    app.sessionId = '';
                }
            } catch (error) {
                console.error('Join error:', error);
                notify('❌ Session Not Found');
                app.sessionId = '';
            }
        }

        async function submitWord(word) {
            if (!word || !app.sessionId) return;
            
            app.words.push({
                text: word.toLowerCase(),
                timestamp: Date.now(),
                id: Math.random().toString(36).substr(2, 9)
            });
            
            // Save to Excel immediately
            await saveToExcel();
            
            app.isSubmitted = true;
            notify('✨ Word Submitted & Saved to Excel');
            sound(1000, 120);
            render();
        }

        async function loadWords() {
            await loadFromExcel();
        }

        function startPoll() {
            if (app.pollInterval) clearInterval(app.pollInterval);
            loadWords();
            app.pollInterval = setInterval(loadWords, 3000);
        }

        function stopPoll() {
            if (app.pollInterval) {
                clearInterval(app.pollInterval);
                app.pollInterval = null;
            }
        }

        async function generateAI() {
            if (app.words.length === 0) {
                notify('❌ No words to analyze');
                return;
            }
            
            app.isGenerating = true;
            app.summary = '';
            render();
            
            try {
                const wordFreq = {};
                app.words.forEach(w => wordFreq[w.text] = (wordFreq[w.text] || 0) + 1);
                const topWords = Object.entries(wordFreq)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 20)
                    .map(([word, count]) => `${word} (${count})`)
                    .join(', ');
                
                const res = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-20250514",
                        max_tokens: 1000,
                        messages: [{
                            role: "user",
                            content: `Analyze this audience feedback from ${app.participants} participants who submitted ${app.words.length} words. Top words with frequency: ${topWords}. Create an insightful, positive 3-4 sentence summary highlighting key themes, sentiment, and what this reveals about the audience's perspective.`
                        }]
                    })
                });
                
                const data = await res.json();
                if (data.content && data.content[0]) {
                    app.summary = data.content[0].text;
                    
                    // Save AI analysis to Excel
                    await saveToExcel();
                    
                    notify('✨ AI Analysis Complete & Saved');
                    sound(1200, 150);
                    setTimeout(() => speak(app.summary), 500);
                } else {
                    throw new Error('Invalid response');
                }
            } catch (e) {
                console.error('AI Error:', e);
                app.summary = 'AI analysis temporarily unavailable. Please try again.';
                notify('❌ Analysis Failed');
            } finally {
                app.isGenerating = false;
                render();
            }
        }

        async function resetSession() {
            if (!confirm('Clear all words? This cannot be undone.')) return;
            
            app.words = [];
            app.summary = '';
            await saveToExcel();
            notify('🗑️ Session Cleared');
            render();
        }

        function copy(text) {
            navigator.clipboard.writeText(text).then(() => {
                notify('📋 Copied to Clipboard');
                sound(700, 80);
            });
        }

        // Render Function
        function render() {
            const root = document.getElementById('app');
            
            if (app.mode === 'select') {
                root.innerHTML = `
                    <div class="screen">
                        <div style="max-width: 900px; text-align: center;">
                            <div style="font-size: 80px; margin-bottom: 20px;">📊</div>
                            <h1 class="hero-title">Interactive Word Cloud</h1>
                            <p style="color: rgba(255,255,255,0.5); font-size: 18px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;">
                                Real-Time Audience Engagement Platform
                            </p>
                            <p style="color: rgba(0, 217, 255, 0.7); font-size: 14px; margin-bottom: 50px;">
                                ✨ All data automatically saved to Excel
                            </p>
                            
                            <div class="grid-2">
                                <div class="card" style="cursor: pointer; transition: all 0.3s; border: 2px solid rgba(0, 217, 255, 0.3);" onclick="createSession()" onmouseover="this.style.borderColor='#00d9ff'" onmouseout="this.style.borderColor='rgba(0, 217, 255, 0.3)'">
                                    <div style="font-size: 70px; margin-bottom: 20px;">🎯</div>
                                    <h2 style="font-size: 28px; margin-bottom: 15px; color: #00d9ff;">Host Session</h2>
                                    <p style="color: rgba(255,255,255,0.6);">Create and manage your word cloud</p>
                                </div>
                                
                                <div class="card">
                                    <div style="font-size: 70px; margin-bottom: 20px;">🚀</div>
                                    <h2 style="font-size: 28px; margin-bottom: 15px; color: #00d9ff;">Join Session</h2>
                                    <input 
                                        type="text" 
                                        id="joinInput" 
                                        class="input-field" 
                                        placeholder="ENTER SESSION CODE"
                                        style="text-transform: uppercase; text-align: center; margin: 20px 0 15px;"
                                        autocomplete="off"
                                    >
                                    <button id="joinBtn" class="btn btn-primary" style="width: 100%;">Connect Now</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                setTimeout(() => {
                    const input = document.getElementById('joinInput');
                    const btn = document.getElementById('joinBtn');
                    if (input && btn) {
                        btn.onclick = () => joinSession(input.value);
                        input.onkeypress = (e) => {
                            if (e.key === 'Enter') joinSession(input.value);
                        };
                        input.focus();
                    }
                }, 100);
                
            } else if (app.mode === 'host') {
                const freq = {};
                app.words.forEach(w => freq[w.text] = (freq[w.text] || 0) + 1);
                const cloud = Object.entries(freq)
                    .map(([text, count]) => ({ text, count, size: Math.min(20 + count * 12, 80) }))
                    .sort((a, b) => b.count - a.count);
                
                root.innerHTML = `
                    <div class="container">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 20px;">
                            <div>
                                <h1 style="font-size: 32px; color: #00d9ff; margin-bottom: 10px;">${app.sessionName}</h1>
                                <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                                    <div class="live-indicator">
                                        <div class="pulse"></div>
                                        <span style="color: #00ff88; font-weight: 600;">LIVE</span>
                                    </div>
                                    <div class="live-indicator">
                                        <span style="color: #00d9ff;">👥 ${app.liveUsers} Online</span>
                                    </div>
                                    ${app.lastExcelUpdate ? `
                                    <div class="live-indicator">
                                        <span style="color: #00d9ff;">📊 Last saved: ${app.lastExcelUpdate}</span>
                                    </div>
                                    ` : ''}
                                </div>
                            </div>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <button class="btn btn-secondary" onclick="generateAI()">🤖 AI Analysis</button>
                                <button class="btn btn-primary" onclick="downloadExcel()">📊 Download Excel</button>
                                <button class="btn btn-secondary" onclick="resetSession()">🗑️ Reset</button>
                                <button class="btn btn-secondary" onclick="stopPoll(); app.mode = 'select'; render();">Exit</button>
                            </div>
                        </div>
                        
                        <div class="grid-4" style="margin-bottom: 25px;">
                            <div class="stat-badge">
                                <div style="color: rgba(255,255,255,0.5); font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Total Words</div>
                                <div class="stat-value">${app.words.length}</div>
                            </div>
                            <div class="stat-badge">
                                <div style="color: rgba(255,255,255,0.5); font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Unique</div>
                                <div class="stat-value">${Object.keys(freq).length}</div>
                            </div>
                            <div class="stat-badge">
                                <div style="color: rgba(255,255,255,0.5); font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Participants</div>
                                <div class="stat-value">${app.participants}</div>
                            </div>
                            <div class="stat-badge">
                                <div style="color: rgba(255,255,255,0.5); font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">Live Users</div>
                                <div class="stat-value">${app.liveUsers}</div>
                            </div>
                        </div>
                        
                        <div class="card" style="margin-bottom: 25px;">
                            <h3 style="color: #00d9ff; font-size: 18px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px;">Session Code</h3>
                            <div class="session-id">${app.sessionId}</div>
                            <button class="btn btn-primary" style="width: 100%; margin-top: 15px;" onclick="copy('${app.sessionId}')">
                                📋 Copy Session Code
                            </button>
                            <div class="excel-indicator" style="width: 100%; justify-content: center;">
                                <span style="color: #00ff88;">✓</span>
                                <span style="color: rgba(255,255,255,0.7);">Auto-saving to Excel storage</span>
                            </div>
                        </div>
                        
                        <div class="card" style="margin-bottom: 25px;">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px;">
                                <h2 style="font-size: 24px; color: #00d9ff; text-transform: uppercase; letter-spacing: 1px;">✨ Word Cloud</h2>
                                <div class="live-indicator">
                                    <div class="pulse"></div>
                                    <span style="color: #00d9ff; font-weight: 600;">${app.words.length} WORDS</span>
                                </div>
                            </div>
                            <div class="cloud-container">
                                ${cloud.length === 0 ? 
                                    '<div style="color: rgba(255,255,255,0.3); text-align: center; font-size: 18px;">Waiting for audience responses...</div>' :
                                    cloud.map(w => `<span class="word-item" style="font-size: ${w.size}px;" title="${w.text}: ${w.count} submission${w.count > 1 ? 's' : ''}">${w.text}</span>`).join('')
                                }
                            </div>
                        </div>
                        
                        ${app.summary ? `
                        <div class="card">
                            <h2 style="font-size: 24px; color: #00d9ff; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px;">🤖 AI Insights</h2>
                            <div style="background: rgba(0, 217, 255, 0.05); border: 1px solid rgba(0, 217, 255, 0.2); border-radius: 12px; padding: 25px; margin-bottom: 15px; line-height: 1.8;">
                                <p style="color: rgba(255,255,255,0.9); font-size: 16px;">${app.summary}</p>
                            </div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                <button class="btn btn-secondary" style="width: 100%;" onclick="speak(app.summary)">
                                    🔊 Play Audio
                                </button>
                                <button class="btn btn-secondary" style="width: 100%;" onclick="app.summary = ''; render();">
                                    Clear
                                </button>
                            </div>
                        </div>
                        ` : app.isGenerating ? `
                        <div class="card">
                            <div style="text-align: center; padding: 30px;">
                                <div style="font-size: 50px; margin-bottom: 15px;">🤖</div>
                                <p style="color: #00d9ff; font-size: 18px;">Analyzing audience responses...</p>
                            </div>
                        </div>
                        ` : ''}
                    </div>
                `;
                
            } else if (app.mode === 'audience') {
                root.innerHTML = `
                    <div class="screen">
                        <div style="max-width: 600px; width: 100%;">
                            <div class="card">
                                <div style="text-align: center; margin-bottom: 35px;">
                                    <div style="font-size: 90px; margin-bottom: 20px;">💭</div>
                                    <h1 style="font-size: 40px; background: linear-gradient(135deg, #00d9ff, #00fff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;">
                                        Share Your Thoughts
                                    </h1>
                                    <p style="color: rgba(255,255,255,0.5); font-size: 16px; text-transform: uppercase; letter-spacing: 1px;">One Word Response</p>
                                </div>
                                
                                ${!app.isSubmitted ? `
                                    <input 
                                        type="text" 
                                        id="wordInput" 
                                        class="input-field" 
                                        placeholder="innovative • inspiring • exciting..."
                                        maxlength="30"
                                        style="text-align: center; font-size: 22px; margin-bottom: 10px;"
                                        autocomplete="off"
                                    >
                                    <p id="charCount" style="color: rgba(255,255,255,0.4); font-size: 13px; text-align: center; margin-bottom: 20px;">0/30 characters</p>
                                    <button id="submitBtn" class="btn btn-primary" style="width: 100%;" disabled>
                                        ✉️ Submit Response
                                    </button>
                                    <div class="excel-indicator" style="width: 100%; justify-content: center;">
                                        <span style="color: rgba(255,255,255,0.5); font-size: 12px;">Will be saved to Excel automatically</span>
                                    </div>
                                ` : `
                                    <div style="text-align: center; padding: 50px 0;">
                                        <div style="font-size: 90px; margin-bottom: 20px;">✓</div>
                                        <h2 style="font-size: 30px; margin-bottom: 15px; color: #00d9ff;">Thank You!</h2>
                                        <p style="color: rgba(255,255,255,0.5); margin-bottom: 15px; text-transform: uppercase;">Response Recorded</p>
                                        <div class="excel-indicator" style="justify-content: center; margin-bottom: 30px;">
                                            <span style="color: #00ff88;">✓</span>
                                            <span style="color: rgba(255,255,255,0.7);">Saved to Excel</span>
                                        </div>
                                        <button class="btn btn-secondary" onclick="app.isSubmitted = false; render();">
                                            Submit Another
                                        </button>
                                    </div>
                                `}
                                
                                <div style="margin-top: 40px; padding-top: 30px; border-top: 1px solid rgba(0, 217, 255, 0.2);">
                                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                                        <h3 style="color: #00d9ff; font-size: 16px; text-transform: uppercase;">Live Feed</h3>
                                        <div class="live-indicator">
                                            <div class="pulse"></div>
                                            <span style="color: #00d9ff; font-weight: 600;">${app.words.length}</span>
                                        </div>
                                    </div>
                                    <div style="display: flex; flex-wrap: wrap; gap: 10px; max-height: 200px; overflow-y: auto;">
                                        ${app.words.length === 0 ? 
                                            '<div style="color: rgba(255,255,255,0.3); text-align: center; width: 100%; padding: 30px;">No submissions yet</div>' :
                                            app.words.slice(-20).reverse().map(w => `<span class="word-tag">${w.text}</span>`).join('')
                                        }
                                    </div>
                                </div>
                            </div>
                            
                            <button class="btn btn-secondary" style="width: 100%; margin-top: 20px;" onclick="stopPoll(); app.mode = 'select'; render();">
                                Leave Session
                            </button>
                        </div>
                    </div>
                `;
                
                setTimeout(() => {
                    const input = document.getElementById('wordInput');
                    const btn = document.getElementById('submitBtn');
                    const count = document.getElementById('charCount');
                    
                    if (input && btn && count) {
                        input.oninput = (e) => {
                            const val = e.target.value;
                            count.textContent = `${val.length}/30 characters`;
                            btn.disabled = !val.trim();
                        };
                        input.onkeypress = (e) => {
                            if (e.key === 'Enter' && e.target.value.trim()) {
                                submitWord(input.value.trim());
                            }
                        };
                        btn.onclick = () => {
                            if (input.value.trim()) {
                                submitWord(input.value.trim());
                            }
                        };
                        input.focus();
                    }
                }, 100);
            }
        }

        // Initialize
        render();
    </script>
</body>
</html>
