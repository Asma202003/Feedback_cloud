<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowd Word Cloud</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #ffffff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.4);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        .screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.5);
        }

        .btn-primary:disabled {
            background: #333;
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #00d4ff;
            border: 2px solid rgba(0, 212, 255, 0.3);
        }

        .btn-danger {
            background: rgba(220, 38, 38, 0.5);
            color: white;
        }

        .card {
            background: rgba(30, 30, 40, 0.7);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
        }

        .card-hover {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            border-color: #00d4ff;
        }

        .input-field {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 18px;
            outline: none;
        }

        .input-field:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .word-cloud {
            min-height: 400px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .word-item {
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .word-item:hover {
            transform: scale(1.1);
        }

        .stat-card {
            background: rgba(30, 30, 40, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #00d4ff;
            margin-top: 10px;
        }

        .word-tag {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        .session-id {
            font-family: 'Courier New', monospace;
            font-size: 32px;
            color: #00d4ff;
            letter-spacing: 5px;
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .hero-title {
            font-size: 64px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 20px;
        }

        .pulse {
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 40px;
            }
            .session-id {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Storage
        const storage = {
            data: {},
            channel: new BroadcastChannel('wordcloud'),
            
            init() {
                const saved = localStorage.getItem('wordcloud_data');
                if (saved) {
                    try {
                        this.data = JSON.parse(saved);
                    } catch (e) {}
                }
                
                this.channel.onmessage = (e) => {
                    if (e.data.type === 'update') {
                        this.data[e.data.key] = e.data.value;
                        if (window.onStorageUpdate) window.onStorageUpdate();
                    }
                };
            },
            
            get(key) {
                return this.data[key] || null;
            },
            
            set(key, value) {
                this.data[key] = value;
                localStorage.setItem('wordcloud_data', JSON.stringify(this.data));
                this.channel.postMessage({ type: 'update', key, value });
            }
        };
        
        storage.init();

        // State
        let app = {
            mode: 'select',
            sessionId: '',
            sessionName: '',
            words: [],
            participants: 0,
            summary: '',
            isGenerating: false,
            isSubmitted: false,
            showStats: false,
            pollInterval: null
        };

        // Utils
        function notify(msg) {
            const n = document.createElement('div');
            n.className = 'notification';
            n.textContent = msg;
            document.body.appendChild(n);
            setTimeout(() => n.remove(), 3000);
        }

        function sound(freq, dur) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + dur/1000);
                osc.start();
                osc.stop(ctx.currentTime + dur/1000);
            } catch(e) {}
        }

        function speak(text) {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.rate = 0.95;
            u.pitch = 1.05;
            speechSynthesis.speak(u);
        }

        // Actions
        function createSession() {
            const name = prompt('Session name (optional):') || 'Word Cloud';
            const id = Math.random().toString(36).substr(2, 9).toUpperCase();
            
            storage.set(`session:${id}`, JSON.stringify({
                words: [],
                participants: 0,
                sessionName: name,
                createdAt: Date.now()
            }));
            
            app.mode = 'host';
            app.sessionId = id;
            app.sessionName = name;
            app.words = [];
            app.participants = 0;
            
            notify(`✨ Session created! ID: ${id}`);
            startPoll();
            render();
        }

        function joinSession(id) {
            const clean = id.trim().toUpperCase();
            if (!clean) {
                notify('❌ Enter a session ID');
                return;
            }
            
            const data = storage.get(`session:${clean}`);
            if (data) {
                const parsed = JSON.parse(data);
                parsed.participants++;
                storage.set(`session:${clean}`, JSON.stringify(parsed));
                
                app.mode = 'audience';
                app.sessionId = clean;
                app.sessionName = parsed.sessionName || 'Word Cloud';
                app.words = parsed.words || [];
                app.participants = parsed.participants;
                app.isSubmitted = false;
                
                notify('✨ Joined!');
                startPoll();
                render();
            } else {
                notify('❌ Session not found');
            }
        }

        function submitWord(word) {
            if (!word || !app.sessionId) return;
            
            const data = storage.get(`session:${app.sessionId}`);
            const parsed = data ? JSON.parse(data) : { words: [], participants: 0 };
            
            parsed.words.push({
                text: word.toLowerCase(),
                timestamp: Date.now(),
                id: Math.random().toString(36)
            });
            
            storage.set(`session:${app.sessionId}`, JSON.stringify(parsed));
            
            app.isSubmitted = true;
            notify('✨ Submitted!');
            sound(800, 100);
            loadWords();
            render();
        }

        function loadWords() {
            if (!app.sessionId) return;
            const data = storage.get(`session:${app.sessionId}`);
            if (data) {
                const parsed = JSON.parse(data);
                app.words = parsed.words || [];
                app.participants = parsed.participants || 0;
                render();
            }
        }

        function startPoll() {
            if (app.pollInterval) clearInterval(app.pollInterval);
            loadWords();
            app.pollInterval = setInterval(loadWords, 2000);
        }

        function stopPoll() {
            if (app.pollInterval) {
                clearInterval(app.pollInterval);
                app.pollInterval = null;
            }
        }

        async function generateAI() {
            app.isGenerating = true;
            app.summary = '';
            render();
            
            try {
                const words = app.words.map(w => w.text).join(', ');
                const res = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-20250514",
                        max_tokens: 1000,
                        messages: [{
                            role: "user",
                            content: `Analyze these ${app.words.length} words: ${words}. Generate a positive 3-4 sentence summary.`
                        }]
                    })
                });
                
                const data = await res.json();
                app.summary = data.content[0].text;
                notify('✨ Summary ready!');
                setTimeout(() => speak(app.summary), 500);
            } catch (e) {
                app.summary = 'AI summary unavailable.';
                notify('❌ Summary failed');
            } finally {
                app.isGenerating = false;
                render();
            }
        }

        function resetSession() {
            if (!confirm('Clear all words?')) return;
            const data = storage.get(`session:${app.sessionId}`);
            const parsed = data ? JSON.parse(data) : {};
            parsed.words = [];
            storage.set(`session:${app.sessionId}`, JSON.stringify(parsed));
            app.words = [];
            app.summary = '';
            notify('🗑️ Cleared');
            render();
        }

        function exportData() {
            const freq = {};
            app.words.forEach(w => freq[w.text] = (freq[w.text] || 0) + 1);
            
            const exp = {
                sessionName: app.sessionName,
                totalWords: app.words.length,
                uniqueWords: Object.keys(freq).length,
                participants: app.participants,
                words: freq,
                summary: app.summary,
                timestamp: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(exp, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `wordcloud-${app.sessionId}.json`;
            a.click();
            notify('📥 Exported!');
        }

        function copy(text) {
            navigator.clipboard.writeText(text);
            notify('📋 Copied!');
        }

        // Render
        function render() {
            const root = document.getElementById('app');
            
            if (app.mode === 'select') {
                root.innerHTML = `
                    <div class="screen">
                        <div style="max-width: 900px; text-align: center;">
                            <h1 class="hero-title">Crowd Word Cloud</h1>
                            <p style="color: rgba(255,255,255,0.6); font-size: 20px; margin-bottom: 60px;">
                                Real-time audience feedback
                            </p>
                            
                            <div class="grid-2">
                                <div class="card card-hover" style="background: linear-gradient(135deg, #00d4ff, #0066ff);" onclick="createSession()">
                                    <div style="font-size: 60px; margin-bottom: 20px;">👥</div>
                                    <h2 style="font-size: 32px; margin-bottom: 10px;">Host Session</h2>
                                    <p>Create and manage</p>
                                </div>
                                
                                <div class="card">
                                    <div style="font-size: 60px; margin-bottom: 20px;">🚀</div>
                                    <h2 style="font-size: 32px; margin-bottom: 10px;">Join Session</h2>
                                    <p style="margin-bottom: 20px;">Enter Session ID</p>
                                    <input 
                                        type="text" 
                                        id="joinInput" 
                                        class="input-field" 
                                        placeholder="Session ID"
                                        style="text-transform: uppercase; text-align: center; margin-bottom: 10px;"
                                    >
                                    <button id="joinBtn" class="btn btn-primary" style="width: 100%;">Join</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                setTimeout(() => {
                    const input = document.getElementById('joinInput');
                    const btn = document.getElementById('joinBtn');
                    if (input && btn) {
                        btn.onclick = () => joinSession(input.value);
                        input.onkeypress = (e) => e.key === 'Enter' && joinSession(input.value);
                    }
                }, 0);
                
            } else if (app.mode === 'host') {
                const freq = {};
                app.words.forEach(w => freq[w.text] = (freq[w.text] || 0) + 1);
                const cloud = Object.entries(freq)
                    .map(([text, count]) => ({ text, count, size: Math.min(16 + count * 10, 80) }))
                    .sort((a, b) => b.count - a.count);
                const top = cloud.slice(0, 5);
                
                root.innerHTML = `
                    <div class="container">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 20px;">
                            <div>
                                <h1 style="font-size: 36px; background: linear-gradient(135deg, #00d4ff, #0066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                                    ${app.sessionName}
                                </h1>
                                <div style="display: flex; gap: 10px; align-items: center;">
                                    <div class="pulse"></div>
                                    <span style="color: rgba(255,255,255,0.6);">Live</span>
                                </div>
                            </div>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                                <button class="btn btn-secondary" onclick="app.showStats = !app.showStats; render();">📊 Stats</button>
                                <button class="btn btn-secondary" onclick="exportData()">💾 Export</button>
                                <button class="btn btn-danger" onclick="resetSession()">🗑️ Clear</button>
                                <button class="btn btn-secondary" onclick="stopPoll(); app.mode = 'select'; render();">Exit</button>
                            </div>
                        </div>
                        
                        ${app.showStats ? `
                        <div class="grid-4" style="margin-bottom: 30px;">
                            <div class="stat-card">
                                <div style="color: rgba(255,255,255,0.6); font-size: 14px;">Total Words</div>
                                <div class="stat-value">${app.words.length}</div>
                            </div>
                            <div class="stat-card">
                                <div style="color: rgba(255,255,255,0.6); font-size: 14px;">Unique</div>
                                <div class="stat-value">${Object.keys(freq).length}</div>
                            </div>
                            <div class="stat-card">
                                <div style="color: rgba(255,255,255,0.6); font-size: 14px;">Participants</div>
                                <div class="stat-value">${app.participants}</div>
                            </div>
                            <div class="stat-card">
                                <div style="color: rgba(255,255,255,0.6); font-size: 14px;">Engagement</div>
                                <div class="stat-value">${app.participants > 0 ? Math.round((app.words.length / app.participants) * 100) : 0}%</div>
                            </div>
                        </div>
                        ` : ''}
                        
                        <div class="card" style="margin-bottom: 30px;">
                            <h3 style="color: #00d4ff; font-size: 20px; margin-bottom: 15px;">Share Session ID</h3>
                            <div class="session-id">${app.sessionId}</div>
                            <button class="btn btn-primary" style="width: 100%; margin-top: 15px;" onclick="copy('${app.sessionId}')">
                                Copy Session ID
                            </button>
                        </div>
                        
                        <div class="grid-2" style="margin-bottom: 30px; grid-template-columns: 2fr 1fr;">
                            <div class="card">
                                <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                                    <h2 style="font-size: 24px; color: #00d4ff;">✨ Live Cloud</h2>
                                    <div style="display: flex; align-items: center; gap: 10px;">
                                        <div class="pulse"></div>
                                        <span style="background: rgba(0,212,255,0.2); color: #00d4ff; padding: 5px 15px; border-radius: 20px; font-weight: bold;">
                                            ${app.words.length}
                                        </span>
                                    </div>
                                </div>
                                <div class="word-cloud">
                                    ${cloud.length === 0 ? '<div style="color: rgba(255,255,255,0.4); text-align: center;">Waiting for words...</div>' :
                                        cloud.map(w => `<span class="word-item" style="font-size: ${w.size}px;" title="${w.text}: ${w.count}">${w.text}</span>`).join('')
                                    }
                                </div>
                            </div>
                            
                            <div class="card">
                                <h2 style="font-size: 24px; color: #00d4ff; margin-bottom: 20px;">🤖 AI Summary</h2>
                                <button class="btn btn-primary" style="width: 100%; margin-bottom: 20px;" onclick="generateAI()" ${app.isGenerating || app.words.length === 0 ? 'disabled' : ''}>
                                    ${app.isGenerating ? '⏳ Generating...' : '✨ Generate'}
                                </button>
                                ${app.summary ? `
                                    <div style="background: rgba(0,0,0,0.3); border: 1px solid rgba(0,212,255,0.2); border-radius: 10px; padding: 20px; margin-bottom: 15px;">
                                        <p style="line-height: 1.6;">${app.summary}</p>
                                    </div>
                                    <button class="btn btn-secondary" style="width: 100%;" onclick="speak('${app.summary.replace(/'/g, "\\'")}')">
                                        🔊 Play
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                        
                        <div class="grid-2">
                            <div class="card">
                                <h3 style="color: #00d4ff; font-size: 20px; margin-bottom: 20px;">🏆 Top 5</h3>
                                ${top.length === 0 ? '<div style="color: rgba(255,255,255,0.4); text-align: center; padding: 40px;">No words yet</div>' :
                                    top.map((w, i) => `
                                        <div style="display: flex; align-items: center; gap: 15px; background: rgba(0,0,0,0.3); border: 1px solid rgba(0,212,255,0.2); border-radius: 10px; padding: 15px; margin-bottom: 10px;">
                                            <div style="font-size: 28px; font-weight: bold; color: #00d4ff; width: 40px;">${i + 1}</div>
                                            <div style="flex: 1; font-weight: bold;">${w.text}</div>
                                            <div style="background: rgba(0,212,255,0.2); color: #00d4ff; padding: 5px 15px; border-radius: 20px; font-weight: bold;">${w.count}</div>
                                        </div>
                                    `).join('')
                                }
                            </div>
                            
                            <div class="card">
                                <h3 style="color: #00d4ff; font-size: 20px; margin-bottom: 20px;">📝 Recent</h3>
                                <div style="display: flex; flex-wrap: wrap; gap: 10px; max-height: 250px; overflow-y: auto;">
                                    ${app.words.length === 0 ? '<div style="color: rgba(255,255,255,0.4); text-align: center; width: 100%; padding: 40px;">No submissions</div>' :
                                        app.words.slice(-30).reverse().map(w => `<span class="word-tag">${w.text}</span>`).join('')
                                    }
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
            } else if (app.mode === 'audience') {
                root.innerHTML = `
                    <div class="screen">
                        <div style="max-width: 600px; width: 100%;">
                            <div class="card">
                                <div style="text-align: center; margin-bottom: 30px;">
                                    <div style="font-size: 80px; margin-bottom: 20px;">✨</div>
                                    <h1 style="font-size: 42px; background: linear-gradient(135deg, #00d4ff, #0066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px;">
                                        Share Feedback
                                    </h1>
                                    <p style="color: rgba(255,255,255,0.6); font-size: 18px;">One word</p>
                                </div>
                                
                                ${!app.isSubmitted ? `
                                    <input 
                                        type="text" 
                                        id="wordInput" 
                                        class="input-field" 
                                        placeholder="amazing • excited • inspired..."
                                        maxlength="30"
                                        style="text-align: center; font-size: 24px; margin-bottom: 10px;"
                                    >
                                    <p id="charCount" style="color: rgba(255,255,255,0.6); font-size: 14px; text-align: center; margin-bottom: 20px;">0/30</p>
                                    <button id="submitBtn" class="btn btn-primary" style="width: 100%;" disabled>
                                        ✉️ Submit
                                    </button>
                                ` : `
                                    <div style="text-align: center; padding: 40px 0;">
                                        <div style="font-size: 80px; margin-bottom: 20px;">✓</div>
                                        <h2 style="font-size: 28px; margin-bottom: 10px;">Thank You!</h2>
                                        <p style="color: rgba(255,255,255,0.6); margin-bottom: 30px;">Recorded</p>
                                        <button class="btn btn-secondary" onclick="app.isSubmitted = false; render();">
                                            Submit Another
                                        </button>
                                    </div>
                                `}
                                
                                <div style="margin-top: 40px; padding-top: 30px; border-top: 1px solid rgba(0,212,255,0.2);">
                                    <h3 style="text-align: center; color: #00d4ff; margin-bottom: 20px;">📊 Live (${app.words.length})</h3>
                                    <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-height: 150px; overflow-y: auto;">
                                        ${app.words.slice(-15).reverse().map(w => `<span class="word-tag">${w.text}</span>`).join('')}
                                    </div>
                                </div>
                            </div>
                            
                            <button class="btn btn-secondary" style="width: 100%; margin-top: 20px;" onclick="stopPoll(); app.mode = 'select'; render();">
                                Leave
                            </button>
                        </div>
                    </div>
                `;
                
                setTimeout(() => {
                    const input = document.getElementById('wordInput');
                    const btn = document.getElementById('submitBtn');
                    const count = document.getElementById('charCount');
                    
                    if (input && btn && count) {
                        input.oninput = (e) => {
                            count.textContent = `${e.target.value.length}/30`;
                            btn.disabled = !e.target.value.trim();
                        };
                        input.onkeypress = (e) => e.key === 'Enter' && e.target.value.trim() && submitWord(input.value.trim());
                        btn.onclick = () => input.value.trim() && submitWord(input.value.trim());
                        input.focus();
                    }
                }, 0);
            }
        }

        // Listen to storage updates
        window.onStorageUpdate = () => {
            if (app.sessionId && (app.mode === 'host' || app.mode === 'audience')) {
                loadWords();
            }
        };

        // Start
        render();
    </script>
</body>
</html>
