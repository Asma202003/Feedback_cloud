<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowd Word Cloud - Interactive Audience Feedback</title>
    <meta name="description" content="Real-time word cloud for audience feedback and engagement">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a2e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.4);
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            max-width: 400px;
        }

        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(0, 212, 255, 0.2);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            color: white;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.5);
        }

        .btn-primary:disabled {
            background: #333;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #00d4ff;
            border: 2px solid rgba(0, 212, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(0, 212, 255, 0.2);
            border-color: #00d4ff;
        }

        .btn-danger {
            background: rgba(220, 38, 38, 0.5);
            color: white;
        }

        .btn-danger:hover {
            background: rgba(220, 38, 38, 0.7);
        }

        .card {
            background: rgba(30, 30, 40, 0.7);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .card-hover {
            transition: all 0.3s ease;
        }

        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 212, 255, 0.3);
            border-color: #00d4ff;
        }

        .input-field {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(0, 212, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 18px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .word-cloud-container {
            min-height: 400px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 15px;
            padding: 30px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .word-cloud-item {
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            cursor: pointer;
            transition: all 0.3s ease;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            animation: fadeIn 0.5s ease-out;
        }

        .word-cloud-item:hover {
            transform: scale(1.1);
        }

        .stat-card {
            background: rgba(30, 30, 40, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #00d4ff;
            margin-top: 10px;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .top-word-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .top-word-rank {
            font-size: 28px;
            font-weight: bold;
            color: #00d4ff;
            width: 40px;
        }

        .top-word-text {
            flex: 1;
            font-weight: bold;
        }

        .top-word-count {
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        .word-tag {
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            animation: fadeIn 0.5s ease-out;
        }

        .share-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(0, 212, 255, 0.5);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
        }

        .session-id-display {
            font-family: 'Courier New', monospace;
            font-size: 32px;
            color: #00d4ff;
            letter-spacing: 5px;
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin: 15px 0;
        }

        .grid {
            display: grid;
            gap: 20px;
        }

        .grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }

        .grid-4 {
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        }

        .hero-title {
            font-size: 64px;
            font-weight: bold;
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: center;
            margin-bottom: 20px;
        }

        .empty-state {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            padding: 60px 20px;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .flex {
            display: flex;
        }

        .flex-center {
            justify-content: center;
            align-items: center;
        }

        .flex-between {
            justify-content: space-between;
            align-items: center;
        }

        .flex-wrap {
            flex-wrap: wrap;
        }

        .gap-10 {
            gap: 10px;
        }

        .gap-20 {
            gap: 20px;
        }

        .mb-10 {
            margin-bottom: 10px;
        }

        .mb-20 {
            margin-bottom: 20px;
        }

        .mb-30 {
            margin-bottom: 30px;
        }

        .mt-20 {
            margin-top: 20px;
        }

        .text-center {
            text-align: center;
        }

        .text-sm {
            font-size: 14px;
        }

        .text-gray {
            color: rgba(255, 255, 255, 0.6);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.2);
            }
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 40px;
            }
            
            .session-id-display {
                font-size: 24px;
            }
            
            .grid-2, .grid-4 {
                grid-template-columns: 1fr;
            }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Storage Manager
        const StorageManager = {
            data: {},
            channel: new BroadcastChannel('wordcloud_sync'),
            listeners: new Set(),

            init() {
                const saved = localStorage.getItem('wordcloud_data');
                if (saved) {
                    try {
                        this.data = JSON.parse(saved);
                    } catch (e) {
                        this.data = {};
                    }
                }

                this.channel.onmessage = (event) => {
                    if (event.data.type === 'update') {
                        this.data[event.data.key] = event.data.value;
                        this.notifyListeners();
                    } else if (event.data.type === 'delete') {
                        delete this.data[event.data.key];
                        this.notifyListeners();
                    }
                };
            },

            get(key) {
                return this.data[key] || null;
            },

            set(key, value) {
                this.data[key] = value;
                localStorage.setItem('wordcloud_data', JSON.stringify(this.data));
                this.channel.postMessage({ type: 'update', key, value });
                this.notifyListeners();
            },

            delete(key) {
                delete this.data[key];
                localStorage.setItem('wordcloud_data', JSON.stringify(this.data));
                this.channel.postMessage({ type: 'delete', key });
                this.notifyListeners();
            },

            subscribe(callback) {
                this.listeners.add(callback);
                return () => this.listeners.delete(callback);
            },

            notifyListeners() {
                this.listeners.forEach(cb => cb());
            }
        };

        StorageManager.init();

        // App State
        const state = {
            mode: 'select',
            sessionId: '',
            sessionName: '',
            words: [],
            participants: 0,
            summary: '',
            isGenerating: false,
            isSubmitted: false,
            showStats: false,
            notification: '',
            updateCallbacks: new Set()
        };

        function updateState(newState) {
            Object.assign(state, newState);
            state.updateCallbacks.forEach(cb => cb());
        }

        function subscribe(callback) {
            state.updateCallbacks.add(callback);
            return () => state.updateCallbacks.delete(callback);
        }

        // Utility Functions
        function showNotification(message) {
            updateState({ notification: message });
            setTimeout(() => updateState({ notification: '' }), 3000);
        }

        function playSound(frequency, duration) {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = frequency;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration / 1000);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration / 1000);
            } catch (e) {
                // Audio not supported
            }
        }

        function playNarration(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.95;
            utterance.pitch = 1.05;
            window.speechSynthesis.speak(utterance);
        }

        // Session Functions
        function createSession() {
            const name = prompt('Enter a name for your session (optional):') || 'Word Cloud Session';
            const sessionId = Math.random().toString(36).substr(2, 9).toUpperCase();

            const sessionData = {
                words: [],
                participants: 0,
                sessionName: name,
                createdAt: Date.now()
            };

            StorageManager.set(`session:${sessionId}`, JSON.stringify(sessionData));

            updateState({
                mode: 'host',
                sessionId: sessionId,
                sessionName: name,
                words: [],
                participants: 0
            });

            const newUrl = `${window.location.origin}${window.location.pathname}?session=${sessionId}`;
            window.history.pushState({}, '', newUrl);

            showNotification(`✨ Session created! ID: ${sessionId}`);
            startPolling();
        }

        function joinSession(sid) {
            const cleanId = sid.trim().toUpperCase();

            if (!cleanId) {
                showNotification('❌ Please enter a valid session ID');
                return;
            }

            const data = StorageManager.get(`session:${cleanId}`);

            if (data) {
                const parsed = JSON.parse(data);
                parsed.participants = (parsed.participants || 0) + 1;
                StorageManager.set(`session:${cleanId}`, JSON.stringify(parsed));

                updateState({
                    mode: 'audience',
                    sessionId: cleanId,
                    sessionName: parsed.sessionName || 'Word Cloud Session',
                    words: parsed.words || [],
                    participants: parsed.participants
                });

                const newUrl = `${window.location.origin}${window.location.pathname}?session=${cleanId}`;
                window.history.pushState({}, '', newUrl);

                showNotification('✨ Successfully joined session!');
                startPolling();
            } else {
                showNotification('❌ Session not found. Please check the Session ID.');
            }
        }

        function submitWord() {
            const input = document.getElementById('wordInput');
            const word = input.value.trim();

            if (!word || !state.sessionId) return;

            const data = StorageManager.get(`session:${state.sessionId}`);
            const parsed = data ? JSON.parse(data) : { words: [], participants: 0 };

            parsed.words.push({
                text: word.toLowerCase(),
                timestamp: Date.now(),
                id: Math.random().toString(36)
            });

            StorageManager.set(`session:${state.sessionId}`, JSON.stringify(parsed));

            input.value = '';
            updateState({ isSubmitted: true });
            showNotification('✨ Thank you! Your word has been submitted.');
            playSound(800, 100);
            loadWords();
        }

        function loadWords() {
            if (!state.sessionId) return;
            
            const data = StorageManager.get(`session:${state.sessionId}`);
            if (data) {
                const parsed = JSON.parse(data);
                updateState({
                    words: parsed.words || [],
                    participants: parsed.participants || 0,
                    sessionName: parsed.sessionName || state.sessionName
                });
            }
        }

        let pollingInterval;
        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            loadWords();
            pollingInterval = setInterval(loadWords, 2000);
        }

        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }

        async function generateSummary() {
            updateState({ isGenerating: true, summary: '' });

            try {
                const wordList = state.words.map(w => w.text).join(', ');

                const response = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-20250514",
                        max_tokens: 1000,
                        messages: [{
                            role: "user",
                            content: `Analyze these ${state.words.length} words from ${state.participants} participants: ${wordList}

Generate an enthusiastic, positive 3-4 sentence summary that captures the dominant themes, emotions, and overall sentiment.`
                        }]
                    })
                });

                const data = await response.json();
                const summaryText = data.content[0].text;
                updateState({ summary: summaryText });
                showNotification('✨ Summary generated successfully!');
                setTimeout(() => playNarration(summaryText), 500);
            } catch (error) {
                updateState({ summary: 'Unable to generate AI summary. Feature requires API access.' });
                showNotification('❌ AI summary unavailable.');
            } finally {
                updateState({ isGenerating: false });
            }
        }

        function resetSession() {
            if (confirm('Are you sure you want to clear all words?')) {
                const data = StorageManager.get(`session:${state.sessionId}`);
                const parsed = data ? JSON.parse(data) : {};
                parsed.words = [];
                StorageManager.set(`session:${state.sessionId}`, JSON.stringify(parsed));
                updateState({ words: [], summary: '' });
                showNotification('🗑️ Session cleared!');
            }
        }

        function exportData() {
            const wordFreq = {};
            state.words.forEach(w => {
                wordFreq[w.text] = (wordFreq[w.text] || 0) + 1;
            });

            const exportData = {
                sessionName: state.sessionName,
                totalWords: state.words.length,
                uniqueWords: Object.keys(wordFreq).length,
                participants: state.participants,
                words: wordFreq,
                summary: state.summary,
                timestamp: new Date().toISOString()
            };

            const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `wordcloud-${state.sessionId}.json`;
            a.click();
            showNotification('📥 Data exported!');
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            showNotification('📋 Copied to clipboard!');
        }

        // Render Functions
        function render() {
            const app = document.getElementById('app');
            
            if (state.notification) {
                const notif = document.createElement('div');
                notif.className = 'notification';
                notif.textContent = state.notification;
                document.body.appendChild(notif);
                setTimeout(() => notif.remove(), 3000);
            }

            if (state.mode === 'select') {
                app.innerHTML = renderSelectMode();
            } else if (state.mode === 'host') {
                app.innerHTML = renderHostMode();
            } else if (state.mode === 'audience') {
                app.innerHTML = renderAudienceMode();
            }

            attachEventListeners();
        }

        function renderSelectMode() {
            return `
                <div class="loading-screen">
                    <div style="text-align: center; max-width: 900px; padding: 40px;">
                        <h1 class="hero-title">Crowd Word Cloud</h1>
                        <p class="text-gray" style="font-size: 20px; margin-bottom: 60px;">Real-time audience feedback visualization</p>
                        
                        <div class="grid grid-2">
                            <div class="card card-hover" style="background: linear-gradient(135deg, #00d4ff, #0066ff); cursor: pointer;" onclick="createSession()">
                                <div style="font-size: 60px; margin-bottom: 20px;">👥</div>
                                <h2 style="font-size: 32px; margin-bottom: 10px;">Host Session</h2>
                                <p>Create and manage your word cloud</p>
                            </div>
                            
                            <div class="card card-hover">
                                <div style="font-size: 60px; margin-bottom: 20px;">🚀</div>
                                <h2 style="font-size: 32px; margin-bottom: 10px;">Join Session</h2>
                                <p class="mb-20">Enter the Session ID from your host</p>
                                <input 
                                    type="text" 
                                    id="joinInput" 
                                    class="input-field mb-10" 
                                    placeholder="Session ID (e.g. ABC123XYZ)"
                                    style="text-transform: uppercase; text-align: center; font-size: 20px;"
                                    onkeypress="if(event.key==='Enter') document.getElementById('joinBtn').click()"
                                >
                                <button id="joinBtn" class="btn btn-primary" style="width: 100%;">Join Session</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHostMode() {
            const currentUrl = `${window.location.origin}${window.location.pathname}?session=${state.sessionId}`;
            const wordFreq = {};
            state.words.forEach(w => {
                wordFreq[w.text] = (wordFreq[w.text] || 0) + 1;
            });

            const wordCloudData = Object.entries(wordFreq)
                .map(([text, count]) => ({
                    text,
                    count,
                    size: Math.min(16 + count * 10, 80)
                }))
                .sort((a, b) => b.count - a.count);

            const topWords = wordCloudData.slice(0, 5);

            return `
                <div class="container">
                    <div class="flex flex-between flex-wrap gap-20 mb-30">
                        <div>
                            <h1 style="font-size: 36px; background: linear-gradient(135deg, #00d4ff, #0066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px;">
                                ${state.sessionName}
                            </h1>
                            <div class="flex gap-10" style="align-items: center;">
                                <div class="pulse-dot"></div>
                                <span class="text-gray">Live Session</span>
                            </div>
                        </div>
                        <div class="flex flex-wrap gap-10">
                            <button class="btn btn-primary" onclick="copyToClipboard('${currentUrl}')">🔗 Share Link</button>
                            <button class="btn btn-secondary" onclick="updateState({showStats: !state.showStats}); render();">📊 Stats</button>
                            <button class="btn btn-secondary" onclick="exportData()">💾 Export</button>
                            <button class="btn btn-danger" onclick="resetSession()">🗑️ Clear</button>
                            <button class="btn btn-secondary" onclick="stopPolling(); updateState({mode: 'select'}); window.history.pushState({}, '', window.location.pathname); render();">Exit</button>
                        </div>
                    </div>

                    ${state.showStats ? `
                    <div class="grid grid-4 mb-30">
                        <div class="stat-card">
                            <div class="stat-label">Total Words</div>
                            <div class="stat-value">${state.words.length}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Unique Words</div>
                            <div class="stat-value">${Object.keys(wordFreq).length}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Participants</div>
                            <div class="stat-value">${state.participants}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Engagement</div>
                            <div class="stat-value">${state.participants > 0 ? Math.round((state.words.length / state.participants) * 100) : 0}%</div>
                        </div>
                    </div>
                    ` : ''}

                    <div class="share-box mb-30">
                        <h3 style="color: #00d4ff; font-size: 20px; margin-bottom: 15px;">🔗 Share With Your Audience</h3>
                        <p class="text-gray text-sm mb-20">Anyone with this link can join and submit words:</p>
                        <div style="background: rgba(0,0,0,0.4); border: 2px solid rgba(0,212,255,0.5); border-radius: 10px; padding: 15px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
                            <code style="flex: 1; word-break: break-all; color: #00d4ff;">${currentUrl}</code>
                            <button class="btn btn-primary" onclick="copyToClipboard('${currentUrl}')">Copy</button>
                        </div>
                        <div class="text-center mt-20">
                            <p class="text-gray text-sm mb-10">Or share just the Session ID:</p>
                            <div class="session-id-display">${state.sessionId}</div>
                        </div>
                    </div>

                    <div class="grid grid-2 mb-30" style="grid-template-columns: 2fr 1fr;">
                        <div class="card">
                            <div class="flex flex-between mb-20">
                                <h2 style="font-size: 24px; color: #00d4ff;">✨ Live Word Cloud</h2>
                                <div class="flex gap-10" style="align-items: center;">
                                    <div class="pulse-dot"></div>
                                    <span style="background: rgba(0,212,255,0.2); color: #00d4ff; padding: 5px 15px; border-radius: 20px; font-weight: bold;">${state.words.length}</span>
                                </div>
                            </div>
                            <div class="word-cloud-container">
                                ${wordCloudData.length === 0 ? `
                                    <div class="empty-state">
                                        <div style="font-size: 60px; margin-bottom: 20px;">👥</div>
                                        <p style="font-size: 20px;">Waiting for audience feedback...</p>
                                        <p style="font-size: 14px; margin-top: 10px;">Share the link above to get started</p>
                                    </div>
                                ` : wordCloudData.map(word => `
                                    <span class="word-cloud-item" style="font-size: ${word.size}px;" title="${word.text}: ${word.count} times">
                                        ${word.text}
                                    </span>
                                `).join('')}
                            </div>
                        </div>

                        <div class="card">
                            <h2 style="font-size: 24px; color: #00d4ff; margin-bottom: 20px;">🤖 AI Summary</h2>
                            <button 
                                class="btn btn-primary mb-20" 
                                style="width: 100%;"
                                onclick="generateSummary()"
                                ${state.isGenerating || state.words.length === 0 ? 'disabled' : ''}
                            >
                                ${state.isGenerating ? '⏳ Generating...' : '✨ Generate Summary'}
                            </button>
                            ${state.summary ? `
                                <div style="background: rgba(0,0,0,0.3); border: 1px solid rgba(0,212,255,0.2); border-radius: 10px; padding: 20px; margin-bottom: 15px; position: relative;">
                                    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: linear-gradient(90deg, #00d4ff, #0066ff);"></div>
                                    <p style="color: #ddd; line-height: 1.6;">${state.summary}</p>
                                </div>
                                <button class="btn btn-secondary" style="width: 100%;" onclick="playNarration('${state.summary.replace(/'/g, "\\'")}')">
                                    🔊 Play Narration
                                </button>
                            ` : ''}
                        </div>
                    </div>

                    <div class="grid grid-2">
                        <div class="card">
                            <h3 style="color: #00d4ff; font-size: 20px; margin-bottom: 20px;">🏆 Top 5 Words</h3>
                            ${topWords.length === 0 ? '<div class="empty-state"><p>No words submitted yet</p></div>' : 
                                topWords.map((word, i) => `
                                    <div class="top-word-item">
                                        <div class="top-word-rank">${i + 1}</div>
                                        <div class="top-word-text">${word.text}</div>
                                        <div class="top-word-count">${word.count}</div>
                                    </div>
                                `).join('')
                            }
                        </div>

                        <div class="card">
                            <h3 style="color: #00d4ff; font-size: 20px; margin-bottom: 20px;">📝 Recent Submissions</h3>
                            <div class="flex flex-wrap gap-10" style="max-height: 250px; overflow-y: auto;">
                                ${state.words.length === 0 ? '<div class="empty-state"><p>No submissions yet</p></div>' :
                                    state.words.slice(-30).reverse().map(word => `
                                        <span class="word-tag">${word.text}</span>
                                    `).join('')
                                }
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderAudienceMode() {
            return `
                <div class="loading-screen">
                    <div style="max-width: 600px; width: 100%;">
                        <div class="card">
                            <div class="text-center mb-30">
                                <div style="font-size: 80px; margin-bottom: 20px;">✨</div>
                                <h1 style="font-size: 42px; background: linear-gradient(135deg, #00d4ff, #0066ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 10px;">
                                    Share Your Feedback
                                </h1>
                                <p class="text-gray" style="font-size: 18px;">Express yourself in one powerful word</p>
                            </div>

                            ${!state.isSubmitted ? `
                                <input 
                                    type="text" 
                                    id="wordInput" 
                                    class="input-field mb-10" 
                                    placeholder="amazing • excited • inspired • grateful..."
                                    maxlength="30"
                                    style="text-align: center; font-size: 24px;"
                                    onkeypress="if(event.key==='Enter') submitWord()"
                                >
                                <p class="text-gray text-sm text-center mb-20" id="charCount">0/30 characters</p>
                                <button class="btn btn-primary" style="width: 100%;" onclick="submitWord()" id="submitBtn">
                                    ✉️ Submit Your Word
                                </button>
                            ` : `
                                <div class="text-center" style="padding: 40px 0;">
                                    <div style="font-size: 80px; margin-bottom: 20px;">✓</div>
                                    <h2 style="font-size: 28px; margin-bottom: 10px;">Thank You!</h2>
                                    <p class="text-gray mb-30">Your feedback has been recorded</p>
                                    <button class="btn btn-secondary" onclick="updateState({isSubmitted: false}); render();">
                                        Submit Another Word
                                    </button>
                                </div>
                            `}

                            <div style="margin-top: 40px; padding-top: 30px; border-top: 1px solid rgba(0,212,255,0.2);">
                                <h3 class="text-center" style="color: #00d4ff; margin-bottom: 20px;">📊 Live Feed (${state.words.length} words)</h3>
                                <div class="flex flex-wrap gap-10" style="justify-content: center; max-height: 150px; overflow-y: auto;">
                                    ${state.words.slice(-15).reverse().map(word => `
                                        <span class="word-tag">${word.text}</span>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <button class="btn btn-secondary mt-20" style="width: 100%;" onclick="stopPolling(); updateState({mode: 'select'}); window.history.pushState({}, '', window.location.pathname); render();">
                            Leave Session
                        </button>
                    </div>
                </div>
            `;
        }

        function attachEventListeners() {
            const joinBtn = document.getElementById('joinBtn');
            if (joinBtn) {
                joinBtn.onclick = () => {
                    const input = document.getElementById('joinInput');
                    if (input && input.value.trim()) {
                        joinSession(input.value.trim());
                    } else {
                        showNotification('❌ Please enter a session ID');
                    }
                };
            }

            const wordInput = document.getElementById('wordInput');
            if (wordInput) {
                wordInput.oninput = (e) => {
                    const charCount = document.getElementById('charCount');
                    if (charCount) {
                        charCount.textContent = `${e.target.value.length}/30 characters`;
                    }
                    const submitBtn = document.getElementById('submitBtn');
                    if (submitBtn) {
                        submitBtn.disabled = !e.target.value.trim();
                    }
                };
            }
        }

        // Initialize
        subscribe(render);

        // Check URL for session
        const params = new URLSearchParams(window.location.search);
        const urlSessionId = params.get('session');
        if (urlSessionId) {
            joinSession(urlSessionId);
        }

        // Storage listener
        StorageManager.subscribe(() => {
            if (state.sessionId) {
                loadWords();
            }
        });

        // Initial render
        render();
    </script>
</body>
</html>
